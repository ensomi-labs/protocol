name: Check protocol package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  node:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run format
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir dist/
      - run: python -m pip install dist/*.whl
      - run: python -c "from ensomi.protocol.v1 import envelope_pb2; envelope_pb2.Envelope(session_id='ci')"

  swift:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-
      - run: swift build
