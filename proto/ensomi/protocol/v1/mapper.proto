syntax = "proto3";

package ensomi.protocol.v1;

message MapperStreamBeginEvent {
  reserved 1;
  reserved "route";

  uint32 token_contract_version = 2;
  optional uint32 audio_length_ms = 3;
}

message HitObjectTokenEvent {
  uint32 token_id = 1;
  uint32 ms_in_ref_audio = 2;
  uint32 token_index = 3;
}
