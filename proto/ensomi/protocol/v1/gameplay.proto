syntax = "proto3";

package ensomi.protocol.v1;

// Gameplay contracts for mania 4K: the ruleset a play is judged under, the input a player produced, the
// replay that stores both, and the result.
//
// Judgement is a function of three things and nothing else: the Chart (chart.proto), the Ruleset and the
// input events. How often a client advances its clock, and which client or runtime runs the judgement,
// must not change the outcome. docs/gameplay.md gives the order of evaluation every implementation follows.
//
// These messages are documents, stored or exchanged as a file or an HTTP body. None is an Envelope payload.

// Judgement tier of one object, best to worst. A hold takes the worse of its head and its release tier,
// and is M when its head is not pressed in time or it is not held into the release window.
enum JudgementTier {
  JUDGEMENT_TIER_UNSPECIFIED = 0;

  // Shown as Perfect. Score weight 1.
  JUDGEMENT_TIER_BIG_P = 1;

  // The next four tiers are shown as Good. Score weights 0.9, 0.85, 0.8 and 0.4.
  JUDGEMENT_TIER_P1 = 2;
  JUDGEMENT_TIER_P2 = 3;
  JUDGEMENT_TIER_P3 = 4;
  JUDGEMENT_TIER_G = 5;

  // Shown as Miss. Score weight 0, and it resets the combo.
  JUDGEMENT_TIER_M = 6;
}

// Preset window sets, named by Malody-style judge level. Half-windows in milliseconds; the tail multiplier
// is 1.5 in every preset.
//
//   level   big_p    p1    p2    p3     g
//   A         60    105   120   135   200
//   B         47     63    88   118   200
//   C         40     56    81   111   200
//   D         34     50    75   105   200
//   E         25     50    75   105   200
enum JudgeDifficulty {
  // The windows do not come from a preset.
  JUDGE_DIFFICULTY_UNSPECIFIED = 0;
  JUDGE_DIFFICULTY_A = 1;
  JUDGE_DIFFICULTY_B = 2;
  JUDGE_DIFFICULTY_C = 3;
  JUDGE_DIFFICULTY_D = 4;
  JUDGE_DIFFICULTY_E = 5;
}

// How close to an object's time an input must land for each tier. Windows are symmetric around the object
// time and inclusive: an input with hit error e (input time minus object time) earns the best tier whose
// half-window is at least |e|, and M when |e| exceeds g_ms. Each window is at least the one before it.
message JudgementWindows {
  double big_p_ms = 1;
  double p1_ms = 2;
  double p2_ms = 3;
  double p3_ms = 4;
  double g_ms = 5;

  // Factor applied to all five windows when a hold's release is judged. A release earlier than
  // end_ms - g_ms * tail_multiplier is a miss.
  double tail_multiplier = 6;
}

// Everything a play is judged by.
message Ruleset {
  // The preset these windows came from, for display. Judgement uses windows, never this field.
  JudgeDifficulty difficulty = 1;

  // The windows in force. Producers always fill every field, including for a preset.
  JudgementWindows windows = 2;

  // Version of the rules the windows plug into: per-lane note lock, hold handling and the score weights
  // on JudgementTier. 1 is the rules in docs/gameplay.md. A change to any of them takes a new version, so
  // a stored replay is judged under the rules it was played with.
  uint32 rules_version = 3;
}

enum InputPhase {
  INPUT_PHASE_UNSPECIFIED = 0;
  INPUT_PHASE_PRESS = 1;
  INPUT_PHASE_RELEASE = 2;
}

// A press or release of one lane's key.
message InputEvent {
  // Column, 0 to 3 from left to right, as in ChartObject.lane.
  uint32 lane = 1;

  InputPhase phase = 2;

  // Gameplay chart time of the event, in milliseconds with sub-millisecond precision: the audio clock
  // reading at the event plus Replay.audio_offset_ms. The audio offset is already applied, so judgement
  // reads this value as is. May be negative before the song starts.
  double chart_time_ms = 3;
}

// Which chart a replay was played on, by content, so a reader can check it holds the right one.
message ChartIdentity {
  // Lowercase hex SHA-256 of the binary encoding of the Chart (chart.proto) that was played, serialized
  // with fields in ascending field-number order, as generated code emits them. The Chart holds every
  // object with its time in unshifted audio milliseconds.
  string sha256_hex = 1;

  // Lowercase hex SHA-256 of the audio file the chart was played against, when known.
  optional string audio_sha256_hex = 2;

  // For display.
  optional string title = 3;
  optional string artist = 4;
}

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_MACOS = 1;
  CLIENT_PLATFORM_IOS = 2;
  CLIENT_PLATFORM_ANDROID = 3;
  CLIENT_PLATFORM_WINDOWS = 4;
  CLIENT_PLATFORM_WEB = 5;
}

// The app that recorded a replay.
message ClientIdentity {
  // Stable application identifier, such as "ensomi.macos". Same meaning as NodeHello.app_id.
  string app_id = 1;

  string app_version = 2;

  ClientPlatform platform = 3;
}

// The shared runtime that judged during the recording.
message RuntimeIdentity {
  // Version of the Ensomi runtime, such as "0.1.0".
  string version = 1;
}

// The input log of one play with what is needed to judge it again. Judging a replay against the chart that
// ChartIdentity names, under its ruleset, gives the same PlayResult on every client.
message Replay {
  ChartIdentity chart = 1;

  Ruleset ruleset = 2;

  // Gameplay chart time = audio time + audio_offset_ms. Judgement depends on it only through
  // InputEvent.chart_time_ms, which includes it. Kept so a viewer can put the inputs back on the audio
  // timeline: audio time = chart_time_ms - audio_offset_ms.
  double audio_offset_ms = 3;

  // Added to gameplay chart time to place notes on screen. Never affects judgement.
  double visual_offset_ms = 4;

  // In the order they happened: chart_time_ms never decreases, and events with equal times keep their
  // order here. Per lane, a press follows a release (or the start), and a release follows a press.
  repeated InputEvent inputs = 5;

  ClientIdentity client = 6;

  RuntimeIdentity runtime = 7;
}

// Number of objects judged at each tier. Perfect, Good and Miss counts follow from these: Perfect is
// big_p_count, Miss is m_count, and Good is the sum of p1_count, p2_count, p3_count and g_count.
message TierCounts {
  uint32 big_p_count = 1;
  uint32 p1_count = 2;
  uint32 p2_count = 3;
  uint32 p3_count = 4;
  uint32 g_count = 5;
  uint32 m_count = 6;
}

// The outcome of judging a replay. Every object is judged once, so the tier counts add up to the number of
// objects in the chart.
message PlayResult {
  TierCounts tier_counts = 1;

  // Mean of the tier score weights over all judged objects, from 0 to 1: (big_p_count + 0.9 * p1_count +
  // 0.85 * p2_count + 0.8 * p3_count + 0.4 * g_count) / total. 1 when no object was judged. Implementations
  // agree to floating-point rounding.
  double accuracy = 2;

  // Longest run of consecutive objects, in the order they were judged, with a tier better than M.
  uint32 max_combo = 3;

  // Change to Replay.audio_offset_ms that would centre the player's hits: minus the mean hit error (input
  // time minus object time, positive when late) of the tap or hold head of every object judged better
  // than M. Hold releases and misses do not count. Absent when no object qualifies.
  optional double suggested_audio_offset_adjustment_ms = 4;
}
