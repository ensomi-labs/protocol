[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensomi-protocol"
version = "0.1.0"
description = "Shared Protocol Buffers contracts for Ensomi clients and model services."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = []
keywords = ["ensomi", "protobuf", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["protobuf>=5.26.1,<6"]

[project.urls]
Homepage = "https://github.com/ensomi-labs/protocol"
Repository = "https://github.com/ensomi-labs/protocol"

[tool.setuptools]
package-dir = { "" = "gen/python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["gen/python"]
namespaces = true

[tool.setuptools.package-data]
"ensomi.protocol" = ["py.typed"]
"ensomi.protocol.v1" = ["*.pyi"]
